<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AdForge AI — Brand-grounded ad creative</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet"><script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script><style> :root{--ink:#111827;--muted:#64748b;--line:#e5e7eb;--paper:#f7f7f4;--panel:#fff;--accent:#d65a31;--accent2:#2546d8;--ok:#1e7a5c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:"DM Sans",sans-serif}h1,h2,h3,.display{font-family:"Space Grotesk",sans-serif}.shell{max-width:1240px;margin:auto;padding:32px 24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:42px}.brand{font-weight:700;letter-spacing:-.04em;font-size:20px}.pill{border:1px solid #d9d9d2;background:#fff;border-radius:999px;padding:8px 12px;font-size:12px;color:#475569}.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:28px;align-items:end;margin-bottom:36px}.hero h1{font-size:56px;line-height:1.02;letter-spacing:-.06em;margin:10px 0 16px}.hero p{font-size:17px;color:var(--muted);max-width:690px;line-height:1.6}.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px}.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.stat strong{display:block;font-size:29px;margin-top:8px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:11px;font-weight:700;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:7px}.field label{font-size:12px;font-weight:700}.field input,.field textarea,.field select{font:inherit;padding:12px 13px;border:1px solid #d9dfe7;border-radius:10px;background:#fff}.field textarea{min-height:105px;resize:vertical}.full{grid-column:1/-1}.btn{border:0;border-radius:10px;background:var(--ink);color:#fff;padding:12px 16px;font-weight:700;cursor:pointer}.btn.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn.accent{background:var(--accent)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.sources{margin-top:14px;color:#475569;font-size:12px}.creative{border-top:1px solid var(--line);padding:18px 0}.creative:first-child{border-top:0}.creative h3{margin:0 0 8px;font-size:19px}.copy{line-height:1.55;color:#334155}.tag{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;margin:4px 4px 0 0;background:#fbfbf9}.workspace{margin-top:22px}.notice{padding:12px 14px;border-radius:10px;background:#fff8f4;border:1px solid #f0d4c7;color:#7a371f;margin-bottom:16px;font-size:13px}@media(max-width:900px){.hero,.grid{grid-template-columns:1fr}.statgrid{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:42px}} </style></head><body x-data="app()" x-init="init()"><div class="shell"><div class="top"><div class="brand">adforge<span style="color:var(--accent)">.ai</span></div><div class="pill" x-show="user" x-text="user?.email"></div></div><template x-if="loading"><div class="card">Loading your workspace…</div></template><template x-if="!loading && !user"><div class="hero"><div><div class="eyebrow">RAG × performance creative</div><h1>Stop rewriting the brief. Build from your brand brain.</h1><p>AdForge turns your brand notes, product facts, audience language and past learnings into platform-ready ad variations—without inventing claims.</p><div class="actions"><a class="btn accent" href="/login">Sign in to build</a></div></div><div class="card"><div class="eyebrow">What the engine remembers</div><p><b>Voice</b> — tone, vocabulary, positioning</p><p><b>Proof</b> — approved facts, differentiators, offers</p><p><b>Audience</b> — pain points and objections</p><p><b>Learning</b> — ratings and performance notes feed the next generation</p></div></div></template><template x-if="!loading && user"><div><div class="hero"><div><div class="eyebrow">Campaign workspace</div><h1>Create. Review. Learn.</h1><p>Your brand context is retrieved before every generation, so the output starts closer to something you can actually ship.</p></div><div class="statgrid"><div class="card stat"><div class="eyebrow">Campaigns</div><strong x-text="stats.campaigns"></strong></div><div class="card stat"><div class="eyebrow">Creatives</div><strong x-text="stats.creatives"></strong></div><div class="card stat"><div class="eyebrow">Avg rating</div><strong x-text="stats.avg_rating"></strong></div><div class="card stat"><div class="eyebrow">Feedback</div><strong x-text="stats.feedback_count"></strong></div></div></div><div class="grid"><div class="card"><div class="eyebrow">01 / Brand brain</div><h2>Add the context AI should not forget</h2><div class="formgrid"><div class="field"><label>Source title</label><input x-model="brand.title" placeholder="Website positioning"></div><div class="field"><label>Type</label><select x-model="brand.source_type"><option value="brand-note">Brand note</option><option value="product">Product</option><option value="audience">Audience</option><option value="proof">Proof / facts</option><option value="guidelines">Voice guideline</option></select></div><div class="field full"><label>Content</label><textarea x-model="brand.content" placeholder="Paste product facts, approved claims, audience research, brand voice…"></textarea></div></div><div class="actions"><button class="btn" @click="addBrand()">Index source</button></div><div class="sources"><template x-for="s in sources" :key="s.id"><span class="tag" x-text="s.title"></span></template></div></div><div class="card"><div class="eyebrow">02 / Campaign brief</div><h2>Give the engine a real job</h2><div class="formgrid"><div class="field"><label>Campaign name</label><input x-model="campaign.name" placeholder="Q4 productivity launch"></div><div class="field"><label>Platform</label><select x-model="campaign.platform"><option>Meta</option><option>Google Ads</option><option>LinkedIn</option><option>TikTok</option></select></div><div class="field"><label>Objective</label><select x-model="campaign.objective"><option>Conversions</option><option>Lead generation</option><option>Product launch</option><option>Awareness</option><option>Retargeting</option></select></div><div class="field"><label>Audience</label><input x-model="campaign.audience" placeholder="e.g. SMB founders"></div><div class="field"><label>Offer / angle</label><input x-model="campaign.offer" placeholder="20% launch offer"></div><div class="field"><label>Tone</label><input x-model="campaign.tone" placeholder="Direct, credible, punchy"></div></div><div class="actions"><button class="btn accent" @click="createAndGenerate()">Generate 4 angles</button></div><div class="notice" x-show="message" x-text="message"></div></div></div><div class="card workspace"><div class="eyebrow">03 / Creative lab</div><h2 x-text="result?.campaign?.name || 'Generated creative'"></h2><div class="sources" x-show="result?.sources?.length">RAG sources: <template x-for="s in result?.sources" :key="s.source_id"><span class="tag" x-text="s.title"></span></template></div><template x-for="c in result?.creatives" :key="c.id"><div class="creative"><span class="tag" x-text="c.platform"></span><span class="tag" x-text="c.format"></span><h3 x-text="c.headline"></h3><div class="copy" x-text="c.primary_text"></div><p><b>CTA:</b> <span x-text="c.cta"></span></p><p><b>Visual direction:</b> <span x-text="c.visual_direction"></span></p><p class="copy"><b>Why this angle:</b> <span x-text="c.rationale"></span></p><div class="actions"><button class="btn secondary" @click="feedback(c,5)">Use it</button><button class="btn secondary" @click="feedback(c,3)">Needs edits</button><button class="btn secondary" @click="feedback(c,1)">Reject</button></div></div></template></div></div></template></div><script>function app(){return{user:null,loading:true,stats:{},sources:[],result:null,message:"",brand:{title:"",source_type:"brand-note",content:""},campaign:{name:"",platform:"Meta",objective:"Conversions",audience:"",offer:"",tone:"Direct, credible, punchy"},async init(){const s=await hatchable.auth.getSession();this.user=s?.user||null;this.loading=false;if(this.user){await Promise.all([this.loadStats(),this.loadSources()]);}},async loadStats(){this.stats=await fetch("/api/insights").then(r=>r.json())},async loadSources(){this.sources=await fetch("/api/brand-sources").then(r=>r.json())},async addBrand(){this.message="Indexing…";const r=await fetch("/api/brand-sources",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(this.brand)});const d=await r.json();if(!r.ok){this.message=d.error||"Could not index source";return}this.message="Brand source indexed.";this.brand={title:"",source_type:"brand-note",content:""};await this.loadSources();},async createAndGenerate(){this.message="Creating campaign and generating grounded angles…";const c=await fetch("/api/campaigns",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(this.campaign)}).then(r=>r.json());if(c.error){this.message=c.error;return}const r=await fetch("/api/generate",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({campaign_id:c.id,format:"Feed ad"})});const d=await r.json();if(!r.ok){this.message=d.error||"Generation failed";return}this.result=d;this.message="Generated 4 angles using retrieved brand context.";await this.loadStats();},async feedback(c,rating){const note=rating===5?"Strong candidate":rating===3?"Needs editing":"Rejected";await fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({creative_id:c.id,rating,note})});this.message="Feedback saved. Future generations can learn from it.";await this.loadStats();}}}</script></body></html>
